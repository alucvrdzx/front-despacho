name: Deploy Frontend

on:
  push:
    branches: [deploy]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend via SSM
        run: |
          aws ssm send-command \
            --instance-ids i-06e73676ec6cd14e4 \
            --document-name AWS-RunShellScript \
            --comment "Deploy frontend" \
            --parameters commands=["cd /home/ec2-user/front_despacho","docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}","docker pull juanvillagra/front-despacho:latest","docker stop front-despacho || true","docker rm front-despacho || true","docker run -d --name front-despacho -p 80:80 --restart always juanvillagra/front-despacho:latest"] \
            --timeout-seconds 600
